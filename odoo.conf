[options]
; IMPORTANTE: Enterprise addons deben ir PRIMERO en el path
addons_path = /mnt/custom-addons,/mnt/enterprise-addons,/mnt/community-addons/l10n-spain,/mnt/community-addons/partner-contact,/mnt/community-addons/community-data-files,/mnt/community-addons,/mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo
proxy_mode = True
xmlrpc = True
xmlrpc_port = 8069
longpolling_port = 8072

; Database
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
dbfilter = .*

; Development
dev_mode = reload,qweb,xml

; Workers (for production)
; workers = 4
; max_cron_threads = 2

; Limits
limit_time_cpu = 6000
limit_time_real = 12000
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648

; Logs
log_level = info
log_handler = :INFO
log_db = False
log_db_level = warning
logfile = /var/log/odoo/odoo.log

; Enterprise specific
list_db = True
; Para Enterprise es recomendable deshabilitar la lista de BD en producción
; list_db = False